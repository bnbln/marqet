name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    # Xcode 27 ships in its own image, not in macos-26.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        # The image's default Xcode is its newest stable release; it also carries release candidates.
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Verify
        run: scripts/ci.sh
        env:
          # StoreKit test products came back empty on the iPhone Duo (iOS 27.1) simulator.
          MARQET_SIMULATOR_NAME: iPhone 17
          MARQET_SIMULATOR_RUNTIME: iOS-27-0
