name: CI
on:
  # Branches with a pull request are checked by `pull_request`; `push` only covers main,
  # so a PR branch no longer runs the same 10 minutes twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# A new push to the same PR cancels the run that is still going for the old commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    # Xcode 27 ships in its own image, not in macos-26.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        # The image's default Xcode is its newest stable release; it also carries release candidates.
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      # Xcode's compilation cache is keyed by file content, not by modification time, so it
      # survives a fresh checkout. Every run saves a new entry; the newest one is restored.
      - name: Restore compilation cache
        uses: actions/cache@v4
        with:
          path: .build/CompilationCache
          key: compilation-cache-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}-${{ github.sha }}
          restore-keys: compilation-cache-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}-
      - name: Verify
        run: scripts/ci.sh
