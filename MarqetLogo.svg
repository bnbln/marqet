<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title description">
  <title id="title">Marqet</title>
  <desc id="description">Ein Einkaufswagen mit gefächertem Korb.</desc>

  <rect width="128" height="128" rx="32" fill="#238A5D"/>

  <g fill="none" stroke="#F8F7F1" stroke-linecap="round" stroke-linejoin="round">
    <!-- Handle flows into the broad basket rim. -->
    <path d="M23 24h8.5a5 5 0 0 1 4.9 4.1L42 41" stroke-width="6"/>

    <!-- Tapered wire basket. -->
    <path d="M39 40h68l-9.4 36a7 7 0 0 1-6.8 5.2H54.2a7 7 0 0 1-6.8-5.4L39 40Z" stroke-width="5.5"/>
    <path d="M44 53h59M47 66h52M59 43v33M81 43v33" stroke-width="3.2" opacity=".78"/>

    <!-- Axle and two balanced wheels. -->
    <path d="M56 82v9m31-9v9M50 91h43" stroke-width="4.5"/>
  </g>

  <g fill="#F8F7F1">
    <circle cx="57" cy="100" r="6.5"/>
    <circle cx="87" cy="100" r="6.5"/>
  </g>
  <g fill="#238A5D">
    <circle cx="57" cy="100" r="2"/>
    <circle cx="87" cy="100" r="2"/>
  </g>
</svg>
